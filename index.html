<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
        }
        .calculator {
            background-color: #1e293b;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            width: 320px;
            border: 1px solid #334155;
        }
        .display {
            width: 100%;
            height: 70px;
            background-color: #0f172a;
            border: none;
            border-radius: 12px;
            color: #f8fafc;
            font-size: 2rem;
            text-align: right;
            padding: 10px 16px;
            margin-bottom: 20px;
            direction: ltr; 
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #334155;
            color: #f8fafc;
        }

        button:hover {
            background-color: #475569;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-operator {
            background-color: #3b82f6;
            color: #ffffff;
        }

        .btn-operator:hover {
            background-color: #2563eb;
        }

        .btn-clear {
            background-color: #ef4444;
            color: #ffffff;
        }

        .btn-clear:hover {
            background-color: #dc2626;
        }

        .btn-equal {
            background-color: #10b981;
            color: #ffffff;
            grid-column: span 2;
        }

        .btn-equal:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" class="display" readonly placeholder="0">
        <div class="buttons">
            <button onclick="clearDisplay()" class="btn-clear">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('/')" class="btn-operator">÷</button>
            <button onclick="appendValue('*')" class="btn-operator">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('-')" class="btn-operator">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('+')" class="btn-operator">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="calculate()" class="btn-equal">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        function appendValue(input) {
            display.value += input;
        }

        function clearDisplay() {
            display.value = '';
        }

        function deleteLast() {
            display.value = display.value.slice(0, -1);
        }

        function calculate() {
            try {
                display.value = eval(display.value);
            } catch (error) {
                display.value = 'خطأ';
                setTimeout(() => clearDisplay(), 1500);
            }
        }
    </script>
</body>
</html>
